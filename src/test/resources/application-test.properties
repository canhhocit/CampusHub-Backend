# Never use developer/production data for integration fixtures.
spring.datasource.url=jdbc:h2:mem:campushub-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=3000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.mail.host=localhost
spring.mail.port=1
app.order.expiration-check-interval-ms=3600000
app.frontend.url=http://localhost:5173
app.jwt.secret=test_only_secret_at_least_32_characters_long
app.security.pickup-encryption-key=0123456789abcdef0123456789abcdef
app.admin.email=
app.admin.password=
app.ping.enabled=false


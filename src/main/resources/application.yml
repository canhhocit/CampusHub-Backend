spring:
  application:
    name: CampusHub
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campushub}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS_REQUIRED:false}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0

app:
  mail:
    from: ${MAIL_FROM:noreply@campushub.com}
    sender-name: ${MAIL_SENDER_NAME:CampusHub}
  jwt:
    secret: ${JWT_SECRET:super_secret_key_change_in_production_min_256_bits_length_for_hmac_sha256}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  security:
    pickup-encryption-key: ${PICKUP_ENCRYPTION_KEY:DefaultCampusHubSecretAesKey32Bytes!}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  order:
    expiration-check-interval-ms: ${ORDER_EXPIRATION_CHECK_INTERVAL_MS:60000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/orders}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/orders}
  ping:
    enabled: ${SELF_PING_ENABLED:true}
    url: ${SELF_PING_URL:${RENDER_EXTERNAL_URL:}}
    interval-ms: ${SELF_PING_INTERVAL_MS:300000}


